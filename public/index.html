<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life RPG: Astral Monk Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* BG3 / Dark Fantasy Theme */
        :root {
            --bg-dark: #0f0f12;
            --panel-bg: rgba(26, 26, 29, 0.95);
            --text-gold: #c8a45c;
            --text-white: #e0e0e0;
            --border-gold: #8a6d3b;
            --accent-red: #8b0000;
            --bar-bg: #2b2b2e;
            --bar-fill: linear-gradient(90deg, #b8860b, #ffd700);
            --glow: 0 0 10px rgba(200, 164, 92, 0.4);
        }
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Alegreya+Sans:wght@300;400;700&display=swap');
        body {
            font-family: 'Alegreya Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(circle at center, #1f1f23 0%, #0a0a0c 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1, h2, h3 {
            font-family: 'Cinzel', serif;
            color: var(--text-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
        }
        .panel {
            background: var(--panel-bg);
            border: 2px solid var(--border-gold);
            border-radius: 4px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.6), inset 0 0 50px rgba(0,0,0,0.5);
            position: relative;
        }
        .panel::before, .panel::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border: 2px solid var(--text-gold);
            pointer-events: none;
        }
        .panel::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .panel::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }
        .left-panel { display: flex; flex-direction: column; gap: 15px; }
        .attr-block {
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.3);
            border: 1px solid #444;
            padding: 10px;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .attr-block:hover { transform: translateX(5px); border-color: var(--text-gold); box-shadow: var(--glow); }
        .attr-hex {
            width: 50px;
            height: 50px;
            background: #222;
            border: 2px solid var(--text-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: bold;
            color: var(--text-white);
            margin-right: 15px;
            position: relative;
            box-shadow: 0 0 5px var(--text-gold);
            transform: rotate(45deg);
        }
        .attr-hex span { transform: rotate(-45deg); }
        .attr-details { flex-grow: 1; }
        .attr-name { font-family: 'Cinzel', serif; font-size: 14px; color: var(--text-gold); margin-bottom: 5px; }
        .attr-xp-bar { height: 6px; background: #333; border-radius: 3px; overflow: hidden; border: 1px solid #555; }
        .attr-xp-fill { height: 100%; background: var(--bar-fill); width: 0%; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 5px var(--text-gold); }
        .attr-tooltip { position: absolute; left: 100%; top: 0; background: rgba(0,0,0,0.9); border: 1px solid var(--text-gold); padding: 10px; width: 200px; z-index: 100; display: none; font-size: 12px; color: #ccc; margin-left: 10px; pointer-events: none; }
        .attr-block:hover .attr-tooltip { display: block; }
        .header-panel { text-align: center; margin-bottom: 20px; border-bottom: 2px solid var(--border-gold); padding-bottom: 20px; }
        .level-badge { display: inline-block; width: 60px; height: 60px; line-height: 60px; border-radius: 50%; background: radial-gradient(circle, #ffd700, #b8860b); color: #000; font-size: 24px; font-weight: bold; box-shadow: 0 0 20px var(--text-gold); margin-top: 10px; border: 2px solid #fff; }
        .nav-tabs { display: flex; justify-content: center; border-bottom: 1px solid #444; margin-bottom: 20px; }
        .nav-tab { padding: 10px 30px; cursor: pointer; color: #888; font-family: 'Cinzel', serif; font-size: 16px; transition: all 0.3s; position: relative; }
        .nav-tab:hover { color: var(--text-white); text-shadow: 0 0 5px #fff; }
        .nav-tab.active { color: var(--text-gold); text-shadow: 0 0 8px var(--text-gold); }
        .nav-tab.active::after { content: ''; position: absolute; bottom: -1px; left: 20%; width: 60%; height: 2px; background: var(--text-gold); box-shadow: 0 0 10px var(--text-gold); }
        .quest-list { list-style: none; padding: 0; }
        .quest-item {
            background: linear-gradient(90deg, rgba(255,255,255,0.03), transparent);
            margin-bottom: 8px;
            padding: 12px 15px;
            border-left: 3px solid #444;
            display: flex;
            align-items: center;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .quest-item:hover {
            border-left-color: var(--text-gold);
            background: linear-gradient(90deg, rgba(200, 164, 92, 0.1), transparent);
            transform: translateX(3px);
        }
        .checkbox-custom {
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-gold);
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: #000;
            transition: all 0.2s;
        }
        .checkbox-custom.checked {
            background: var(--text-gold);
            box-shadow: 0 0 10px var(--text-gold);
        }
        .checkbox-custom.checked::after {
            content: '✓';
            color: #000;
            font-weight: bold;
        }
        .quest-text {
            font-size: 16px;
            flex-grow: 1;
            transition: color 0.3s;
        }
        .quest-text.completed {
            color: #666;
            text-decoration: line-through;
            font-style: italic;
        }
        .quest-xp {
            font-size: 11px;
            color: var(--text-gold);
            border: 1px solid var(--border-gold);
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(0,0,0,0.5);
        }
        .chart-container {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #333;
        }
        .section {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .section.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 800px) {
            .container { grid-template-columns: 1fr; }
        }
        
        /* Pomodoro Timer Specific Style */
        .pomodoro-ritual {
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-gold);
            border-radius: 4px;
        }
        #timer-display { font-family: 'Cinzel', serif; font-size: 32px; color: var(--text-gold); margin: 10px 0; text-shadow: 0 0 10px rgba(200, 164, 92, 0.5); }
        .timer-btn {
            background: #000;
            border: 1px solid var(--border-gold);
            color: var(--text-gold);
            padding: 5px 15px;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            margin: 0 5px;
            transition: all 0.2s;
        }
        .timer-btn:hover {
            background: var(--text-gold);
            color: #000;
            box-shadow: 0 0 10px var(--text-gold);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="left-panel panel">
        <h2 style="text-align:center; margin-bottom:20px; border-bottom:1px solid #444; padding-bottom:10px;">Attributes</h2>
        <div id="attributes-list"></div>
        <div class="pomodoro-ritual">
            <h3 style="font-size:14px; color:#888;">Focus Ritual</h3>
            <div id="timer-display">25:00</div>
            <button class="timer-btn" id="start-pause-btn">Start</button>
            <button class="timer-btn" onclick="resetTimer()">Reset</button>
        </div>
    </div>
    <div class="right-panel panel">
        <div class="header-panel">
            <h1 id="char-name">Andrew</h1>
            <div style="color:#888; margin-top:5px; font-family:'Alegreya Sans', sans-serif; font-size:18px;" id="char-class">Level 1 Astral Monk</div>
            <div class="level-badge" id="level-badge">1</div>
        </div>
        <div class="nav-tabs">
            <div class="nav-tab active" onclick="switchTab('daily')">Daily Rituals</div>
            <div class="nav-tab" onclick="switchTab('main')">Quest Log</div>
            <div class="nav-tab" onclick="switchTab('health')">Vitality</div>
        </div>
        <div id="daily" class="section active"><ul class="quest-list" id="daily-list"></ul></div>
        <div id="main" class="section"><ul class="quest-list" id="main-list"></ul></div>
        <div id="health" class="section">
            <div class="chart-container"><canvas id="healthChart"></canvas></div>
            <div style="margin-top:20px; display:flex; justify-content:space-around; font-size:18px;">
                <div>Weight: <span id="weight" style="color:var(--text-gold); font-weight:bold;">-</span></div>
                <div>Body Fat: <span id="bf" style="color:var(--text-gold); font-weight:bold;">-</span></div>
            </div>
        </div>
    </div>
</div>
<script>
    const audio = new Audio('audio.mp3'); audio.volume = 0.4;
    function playSound() { audio.currentTime = 0; audio.play().catch(e => console.log('Audio blocked')); }
    const descriptions = { STR: "Power", DEX: "Agility", CON: "Stamina", INT: "Acuity", WIS: "Insight", CHA: "Confidence" };
    
    async function init() { await loadData(); }
    async function loadData() {
        try {
            const qRes = await fetch('/api/quests'); const qData = await qRes.json();
            renderAttributes(qData.attributes); renderHeader(qData.profile);
            renderList('daily-list', qData.daily); renderList('main-list', qData.main);
            const hRes = await fetch('/api/health'); const hData = await hRes.json(); renderHealth(hData);
        } catch (e) { console.error(e); }
    }
    function renderHeader(profile) { document.getElementById('char-class').textContent = profile.class; document.getElementById('level-badge').textContent = profile.level; }
    function renderAttributes(attrs) {
        const container = document.getElementById('attributes-list'); container.innerHTML = '';
        ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'].forEach(key => {
            const attr = attrs[key] || { score: 10, xp: 0, max: 100 };
            const mod = Math.floor((attr.score - 10) / 2);
            const percent = Math.min(100, (attr.xp / attr.max) * 100);
            const div = document.createElement('div'); div.className = 'attr-block';
            div.innerHTML = `<div class="attr-hex"><span>${attr.score}</span></div><div class="attr-details"><div class="attr-name">${key} (${mod >= 0 ? '+' : ''}${mod})</div><div class="attr-xp-bar"><div class="attr-xp-fill" style="width:${percent}%"></div></div></div><div class="attr-tooltip">${descriptions[key]}</div>`;
            container.appendChild(div);
        });
    }
    function renderList(elId, items) {
        const el = document.getElementById(elId); el.innerHTML = '';
        items.forEach(item => {
            const li = document.createElement('li'); li.className = 'quest-item';
            li.innerHTML = `<div class="checkbox-custom ${item.completed ? 'checked' : ''}" onclick="event.stopPropagation(); toggleQuest('${item.text}', ${!item.completed})"></div><div class="quest-text ${item.completed ? 'completed' : ''}">${item.text}</div>`;
            el.appendChild(li);
        });
    }
    function renderHealth(data) {
        if (!data || data.length === 0) return;
        const last = data[data.length - 1]; document.getElementById('weight').textContent = last.weight + ' lbs'; document.getElementById('bf').textContent = last.bodyFat + '%';
        const ctx = document.getElementById('healthChart').getContext('2d');
        new Chart(ctx, { type: 'line', data: { labels: data.map(d => d.date), datasets: [{ label: 'Weight', data: data.map(d => d.weight), borderColor: '#c8a45c', backgroundColor: 'rgba(200, 164, 92, 0.1)', tension: 0.3, fill: true }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#888' }, grid: { color: '#333' } }, y: { ticks: { color: '#888' }, grid: { color: '#333' } } } } });
    }
    async function toggleQuest(text, shouldCheck) { if (shouldCheck) playSound(); await fetch('/api/quests/toggle', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ questText: text }) }); loadData(); }
    function switchTab(tabName) { document.querySelectorAll('.section').forEach(el => el.classList.remove('active')); document.getElementById(tabName).classList.add('active'); document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active')); event.currentTarget.classList.add('active'); }

    /* POMODORO LOGIC */
    let timerInterval, timeLeft = 25 * 60, isRunning = false;
    const timerDisplay = document.getElementById('timer-display'), startPauseBtn = document.getElementById('start-pause-btn');
    function updateTimer() { const m = Math.floor(timeLeft / 60), s = timeLeft % 60; timerDisplay.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`; }
    function toggleTimer() {
        if (isRunning) { clearInterval(timerInterval); startPauseBtn.textContent = 'Start'; }
        else { 
            timerInterval = setInterval(() => { 
                timeLeft--; updateTimer(); 
                if (timeLeft <= 0) { clearInterval(timerInterval); playSound(); resetTimer(); alert('Ritual Complete!'); }
            }, 1000); 
            startPauseBtn.textContent = 'Pause';
        }
        isRunning = !isRunning;
    }
    function resetTimer() { clearInterval(timerInterval); isRunning = false; timeLeft = 25 * 60; updateTimer(); startPauseBtn.textContent = 'Start'; }
    startPauseBtn.addEventListener('click', toggleTimer);
    init();
</script>
</body>
</html>
